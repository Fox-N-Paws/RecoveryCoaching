<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Fox & Paws Recovery Coaching</title>
<meta name="robots" content="noindex, nofollow">
<script src="firebase-config.js"></script>
<style>
  :root {
    --primary: #5c7348;
    --primary-dark: #3f5232;
    --accent: #f3efe7;
    --soft-bg: #f8f5f0;
    --text: #3c332b;
    --text-light: #6b5e52;
    --border: #ddd5c7;
    --white: #ffffff;
    --danger: #a8402f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.6;
    color: var(--text);
    background: var(--soft-bg);
  }
  #fatal-banner {
    display: none;
    background: #fdecea;
    color: var(--danger);
    border-bottom: 2px solid var(--danger);
    padding: 0.9rem 1.5rem;
    font-size: 0.92rem;
    text-align: center;
  }
  header {
    background: var(--primary-dark);
    color: white;
    padding: 1.1rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.75rem;
  }
  header h1 { font-size: 1.2rem; }
  header a, header button {
    color: white;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.5);
    padding: 0.45rem 0.9rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  #login-screen {
    max-width: 380px;
    margin: 4rem auto;
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 2rem;
  }
  #login-screen h2 { margin-bottom: 1.25rem; color: var(--primary-dark); text-align: center; }
  input, textarea, select {
    width: 100%;
    padding: 0.7rem 0.9rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 1rem;
    font-family: inherit;
    background: white;
    margin-bottom: 0.85rem;
  }
  textarea { min-height: 90px; resize: vertical; }
  .btn {
    display: inline-block;
    background: var(--primary);
    color: white;
    padding: 0.7rem 1.4rem;
    border-radius: 6px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    font-size: 0.95rem;
  }
  .btn:hover { background: var(--primary-dark); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-danger { background: var(--danger); }
  .btn-danger:hover { background: #82301f; }
  .btn-small { padding: 0.4rem 0.8rem; font-size: 0.85rem; }
  .tabs {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.75rem;
    flex-wrap: wrap;
    border-bottom: 2px solid var(--border);
  }
  .tab-btn {
    background: transparent;
    border: none;
    padding: 0.75rem 1.1rem;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-light);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
  }
  .tab-btn.active { color: var(--primary-dark); border-bottom-color: var(--primary); }
  .panel { display: none; }
  .panel.active { display: block; }
  .card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }
  .card h3 { color: var(--primary-dark); margin-bottom: 1rem; font-size: 1.05rem; }
  .item-list { list-style: none; }
  .item-list li {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1rem;
    background: var(--soft-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.9rem 1.1rem;
    margin-bottom: 0.65rem;
  }
  .item-list .item-body { flex: 1; }
  .item-list .item-title { font-weight: 600; color: var(--primary-dark); }
  .item-list .item-sub { font-size: 0.88rem; color: var(--text-light); margin-top: 0.15rem; }
  .item-list img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; margin-right: 0.75rem; }
  .item-row { display: flex; align-items: center; }
  .status { font-size: 0.9rem; margin: 0.5rem 0; min-height: 1.2rem; }
  .status.error { color: var(--danger); }
  .status.ok { color: var(--primary-dark); }
  .hidden { display: none !important; }
  .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 0.5rem 0; }
  .progress-bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.2s; }
</style>
</head>
<body>

<div id="fatal-banner"></div>

<div id="login-screen">
  <h2>Fox & Paws Admin</h2>
  <div id="login-status" class="status error"></div>
  <form id="login-form">
    <input type="email" id="login-email" placeholder="Email" autocomplete="username" required>
    <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit" class="btn" id="login-btn" style="width:100%">Log In</button>
  </form>
</div>

<div id="dashboard" class="hidden">
  <header>
    <h1>Fox & Paws Admin</h1>
    <div>
      <a href="index.html" target="_blank">View Site</a>
      <button id="logout-btn">Log Out</button>
    </div>
  </header>

  <div class="wrap">
    <div class="tabs">
      <button class="tab-btn active" data-tab="testimonials">Testimonials</button>
      <button class="tab-btn" data-tab="photos">Photos</button>
      <button class="tab-btn" data-tab="topics">Weekly Topics</button>
      <button class="tab-btn" data-tab="books">Books</button>
    </div>

    <!-- TESTIMONIALS -->
    <div class="panel active" id="panel-testimonials">
      <div class="card">
        <h3>Add a Testimonial</h3>
        <textarea id="t-quote" placeholder="Testimonial text"></textarea>
        <input type="text" id="t-author" placeholder="Author (e.g. Sarah M.)">
        <input type="text" id="t-year" placeholder="Year (e.g. 2026)">
        <div class="status" id="t-status"></div>
        <button class="btn" id="t-add-btn">Add Testimonial</button>
      </div>
      <div class="card">
        <h3>Current Testimonials</h3>
        <ul class="item-list" id="t-list"><li>Loading…</li></ul>
      </div>
    </div>

    <!-- PHOTOS -->
    <div class="panel" id="panel-photos">
      <div class="card">
        <h3>Upload a Photo</h3>
        <input type="file" id="p-file" accept="image/*">
        <input type="text" id="p-caption" placeholder="Caption (optional)">
        <div class="progress-bar hidden" id="p-progress-wrap"><div class="progress-bar-fill" id="p-progress"></div></div>
        <div class="status" id="p-status"></div>
        <button class="btn" id="p-upload-btn">Upload Photo</button>
      </div>
      <div class="card">
        <h3>Current Photos</h3>
        <ul class="item-list" id="p-list"><li>Loading…</li></ul>
      </div>
    </div>

    <!-- WEEKLY TOPICS -->
    <div class="panel" id="panel-topics">
      <div class="card">
        <h3>Add a Weekly Topic</h3>
        <input type="text" id="w-week" placeholder="Week label (e.g. Week of August 3)">
        <input type="text" id="w-topic" placeholder="Topic">
        <div class="status" id="w-status"></div>
        <button class="btn" id="w-add-btn">Add Topic</button>
      </div>
      <div class="card">
        <h3>Current Weekly Topics</h3>
        <ul class="item-list" id="w-list"><li>Loading…</li></ul>
      </div>
    </div>

    <!-- BOOKS -->
    <div class="panel" id="panel-books">
      <div class="card">
        <h3>Add a Book Recommendation</h3>
        <input type="text" id="b-title" placeholder="Book title">
        <input type="text" id="b-author" placeholder="Author">
        <textarea id="b-note" placeholder="Short note about why you recommend it"></textarea>
        <div class="status" id="b-status"></div>
        <button class="btn" id="b-add-btn">Add Book</button>
      </div>
      <div class="card">
        <h3>Current Books</h3>
        <ul class="item-list" id="b-list"><li>Loading…</li></ul>
      </div>
    </div>
  </div>
</div>

<script>
  // Catch any error anywhere on the page and surface it visibly,
  // instead of it silently dying in the console where no one sees it.
  window.addEventListener('error', function (e) {
    showFatalBanner('Page error: ' + e.message);
  });
  window.addEventListener('unhandledrejection', function (e) {
    showFatalBanner('Error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  function showFatalBanner(msg) {
    const el = document.getElementById('fatal-banner');
    el.textContent = msg;
    el.style.display = 'block';
  }

  // Catch a config that still has placeholder values before Firebase even tries to use it.
  if (!window.firebaseConfig || String(window.firebaseConfig.apiKey || '').includes('PASTE_YOUR')) {
    showFatalBanner('firebase-config.js still has placeholder values — edit it with your real Firebase project settings, then refresh this page.');
  }
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore, collection, query, orderBy, getDocs, addDoc, deleteDoc, doc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import {
    getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js";

  let app, auth, db, storage;
  try {
    app = initializeApp(window.firebaseConfig);
    auth = getAuth(app);
    db = getFirestore(app);
    storage = getStorage(app);
  } catch (e) {
    showFatalBanner('Firebase failed to initialize: ' + e.message);
    throw e;
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  // ---------- AUTH ----------
  const loginForm = document.getElementById('login-form');
  const loginBtn = document.getElementById('login-btn');
  const loginStatus = document.getElementById('login-status');

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault(); // stops the page from reloading, which is what a bare <button> inside a <form> does by default
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    loginStatus.textContent = '';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Logging in…';
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      loginStatus.textContent = 'Login failed: ' + err.message;
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Log In';
    }
  });

  document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      loadAllPanels();
    } else {
      document.getElementById('login-screen').classList.remove('hidden');
      document.getElementById('dashboard').classList.add('hidden');
    }
  });

  // ---------- TABS ----------
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  function loadAllPanels() {
    loadTestimonials();
    loadPhotos();
    loadTopics();
    loadBooks();
  }

  // ---------- TESTIMONIALS ----------
  async function loadTestimonials() {
    const list = document.getElementById('t-list');
    list.innerHTML = '<li>Loading…</li>';
    const q = query(collection(db, 'testimonials'), orderBy('createdAt', 'desc'));
    const snap = await getDocs(q);
    if (snap.empty) { list.innerHTML = '<li>No testimonials yet.</li>'; return; }
    list.innerHTML = '';
    snap.forEach(d => {
      const t = d.data();
      list.insertAdjacentHTML('beforeend', `
        <li>
          <div class="item-body">
            <div class="item-title">${escapeHtml(t.author)} <span class="item-sub">(${escapeHtml(t.year)})</span></div>
            <div class="item-sub">${escapeHtml(t.quote)}</div>
          </div>
          <button class="btn btn-danger btn-small" data-id="${d.id}">Delete</button>
        </li>`);
    });
    list.querySelectorAll('button[data-id]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Delete this testimonial?')) return;
        await deleteDoc(doc(db, 'testimonials', btn.dataset.id));
        loadTestimonials();
      });
    });
  }

  document.getElementById('t-add-btn').addEventListener('click', async () => {
    const quote = document.getElementById('t-quote').value.trim();
    const author = document.getElementById('t-author').value.trim();
    const year = document.getElementById('t-year').value.trim();
    const statusEl = document.getElementById('t-status');
    if (!quote || !author) { statusEl.textContent = 'Quote and author are required.'; statusEl.className = 'status error'; return; }
    try {
      await addDoc(collection(db, 'testimonials'), { quote, author, year, createdAt: serverTimestamp() });
      document.getElementById('t-quote').value = '';
      document.getElementById('t-author').value = '';
      document.getElementById('t-year').value = '';
      statusEl.textContent = 'Added!'; statusEl.className = 'status ok';
      loadTestimonials();
    } catch (e) {
      statusEl.textContent = 'Error: ' + e.message; statusEl.className = 'status error';
    }
  });

  // ---------- PHOTOS ----------
  async function loadPhotos() {
    const list = document.getElementById('p-list');
    list.innerHTML = '<li>Loading…</li>';
    const q = query(collection(db, 'photos'), orderBy('createdAt', 'desc'));
    const snap = await getDocs(q);
    if (snap.empty) { list.innerHTML = '<li>No photos yet.</li>'; return; }
    list.innerHTML = '';
    snap.forEach(d => {
      const p = d.data();
      list.insertAdjacentHTML('beforeend', `
        <li>
          <div class="item-row">
            <img src="${escapeHtml(p.url)}" alt="">
            <div class="item-body">
              <div class="item-sub">${escapeHtml(p.caption || '(no caption)')}</div>
            </div>
          </div>
          <button class="btn btn-danger btn-small" data-id="${d.id}" data-path="${escapeHtml(p.storagePath)}">Delete</button>
        </li>`);
    });
    list.querySelectorAll('button[data-id]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Delete this photo?')) return;
        try { await deleteObject(ref(storage, btn.dataset.path)); } catch (e) { console.warn(e); }
        await deleteDoc(doc(db, 'photos', btn.dataset.id));
        loadPhotos();
      });
    });
  }

  document.getElementById('p-upload-btn').addEventListener('click', () => {
    const fileInput = document.getElementById('p-file');
    const caption = document.getElementById('p-caption').value.trim();
    const statusEl = document.getElementById('p-status');
    const progressWrap = document.getElementById('p-progress-wrap');
    const progressFill = document.getElementById('p-progress');
    const file = fileInput.files[0];
    if (!file) { statusEl.textContent = 'Choose a photo first.'; statusEl.className = 'status error'; return; }

    const storagePath = 'photos/' + Date.now() + '_' + file.name;
    const storageRef = ref(storage, storagePath);
    const task = uploadBytesResumable(storageRef, file);
    progressWrap.classList.remove('hidden');
    statusEl.textContent = ''; statusEl.className = 'status';

    task.on('state_changed',
      (snap) => {
        const pct = Math.round((snap.bytesTransferred / snap.totalBytes) * 100);
        progressFill.style.width = pct + '%';
      },
      (err) => {
        statusEl.textContent = 'Upload failed: ' + err.message; statusEl.className = 'status error';
        progressWrap.classList.add('hidden');
      },
      async () => {
        const url = await getDownloadURL(task.snapshot.ref);
        await addDoc(collection(db, 'photos'), { url, caption, storagePath, createdAt: serverTimestamp() });
        statusEl.textContent = 'Uploaded!'; statusEl.className = 'status ok';
        progressWrap.classList.add('hidden');
        progressFill.style.width = '0%';
        fileInput.value = '';
        document.getElementById('p-caption').value = '';
        loadPhotos();
      }
    );
  });

  // ---------- WEEKLY TOPICS ----------
  async function loadTopics() {
    const list = document.getElementById('w-list');
    list.innerHTML = '<li>Loading…</li>';
    const q = query(collection(db, 'weeklyTopics'), orderBy('createdAt', 'desc'));
    const snap = await getDocs(q);
    if (snap.empty) { list.innerHTML = '<li>No topics yet.</li>'; return; }
    list.innerHTML = '';
    snap.forEach(d => {
      const w = d.data();
      list.insertAdjacentHTML('beforeend', `
        <li>
          <div class="item-body">
            <div class="item-title">${escapeHtml(w.week)}</div>
            <div class="item-sub">${escapeHtml(w.topic)}</div>
          </div>
          <button class="btn btn-danger btn-small" data-id="${d.id}">Delete</button>
        </li>`);
    });
    list.querySelectorAll('button[data-id]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Delete this topic?')) return;
        await deleteDoc(doc(db, 'weeklyTopics', btn.dataset.id));
        loadTopics();
      });
    });
  }

  document.getElementById('w-add-btn').addEventListener('click', async () => {
    const week = document.getElementById('w-week').value.trim();
    const topic = document.getElementById('w-topic').value.trim();
    const statusEl = document.getElementById('w-status');
    if (!week || !topic) { statusEl.textContent = 'Both fields are required.'; statusEl.className = 'status error'; return; }
    try {
      await addDoc(collection(db, 'weeklyTopics'), { week, topic, createdAt: serverTimestamp() });
      document.getElementById('w-week').value = '';
      document.getElementById('w-topic').value = '';
      statusEl.textContent = 'Added!'; statusEl.className = 'status ok';
      loadTopics();
    } catch (e) {
      statusEl.textContent = 'Error: ' + e.message; statusEl.className = 'status error';
    }
  });

  // ---------- BOOKS ----------
  async function loadBooks() {
    const list = document.getElementById('b-list');
    list.innerHTML = '<li>Loading…</li>';
    const q = query(collection(db, 'books'), orderBy('createdAt', 'desc'));
    const snap = await getDocs(q);
    if (snap.empty) { list.innerHTML = '<li>No books yet.</li>'; return; }
    list.innerHTML = '';
    snap.forEach(d => {
      const b = d.data();
      list.insertAdjacentHTML('beforeend', `
        <li>
          <div class="item-body">
            <div class="item-title">${escapeHtml(b.title)} <span class="item-sub">— ${escapeHtml(b.author)}</span></div>
            <div class="item-sub">${escapeHtml(b.note)}</div>
          </div>
          <button class="btn btn-danger btn-small" data-id="${d.id}">Delete</button>
        </li>`);
    });
    list.querySelectorAll('button[data-id]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Delete this book?')) return;
        await deleteDoc(doc(db, 'books', btn.dataset.id));
        loadBooks();
      });
    });
  }

  document.getElementById('b-add-btn').addEventListener('click', async () => {
    const title = document.getElementById('b-title').value.trim();
    const author = document.getElementById('b-author').value.trim();
    const note = document.getElementById('b-note').value.trim();
    const statusEl = document.getElementById('b-status');
    if (!title || !author) { statusEl.textContent = 'Title and author are required.'; statusEl.className = 'status error'; return; }
    try {
      await addDoc(collection(db, 'books'), { title, author, note, createdAt: serverTimestamp() });
      document.getElementById('b-title').value = '';
      document.getElementById('b-author').value = '';
      document.getElementById('b-note').value = '';
      statusEl.textContent = 'Added!'; statusEl.className = 'status ok';
      loadBooks();
    } catch (e) {
      statusEl.textContent = 'Error: ' + e.message; statusEl.className = 'status error';
    }
  });
</script>

</body>
</html>
